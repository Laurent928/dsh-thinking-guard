<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="286" viewBox="0 0 1000 286" role="img" aria-label="dsh-thinking-guard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14151b"/>
      <stop offset="100%" stop-color="#1d1a2b"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="28%" stop-color="#60a5fa"/>
      <stop offset="54%" stop-color="#2dd4bf"/>
      <stop offset="78%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="286" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="285" rx="16" fill="none" stroke="#2c2c3a"/>

  <!-- 左：标题 -->
  <text x="48" y="78" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="13.5" fill="#8b8ba7" letter-spacing="0.14em">DEEPSEEK HARNESS · PLUGIN</text>

  <text x="48" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#f4f4f8">dsh-thinking-guard</text>

  <text x="48" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif" font-size="18" fill="#a3a3bb">让模型别再对着「好。做。好。」原地打转</text>

  <!-- 色阶条：只留五格和一根渐变细线，不再叠泛光 -->
  <g transform="translate(50,224)">
    <rect x="0" y="-6" width="20" height="12" rx="3" fill="#94a3b8"/>
    <rect x="24" y="-6" width="20" height="12" rx="3" fill="#60a5fa"/>
    <rect x="48" y="-6" width="20" height="12" rx="3" fill="#2dd4bf"/>
    <rect x="72" y="-6" width="20" height="12" rx="3" fill="#fbbf24"/>
    <rect x="96" y="-6" width="20" height="12" rx="3" fill="#f87171"/>
    <text x="130" y="4" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="11.5" fill="#6f6f88" letter-spacing="0.1em">OFF · TELL · CUT SLOW · CUT FAST · ABORT</text>
  </g>

  <!-- 右：前后对比（放大到能看清字） -->
  <g transform="translate(576,50)">
    <!-- BEFORE -->
    <rect x="0" y="0" width="168" height="186" rx="10" fill="#0f1015" stroke="#2a2a38"/>
    <text x="16" y="30" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="11.5" fill="#6f6f88" letter-spacing="0.12em">BEFORE</text>
    <text x="16" y="66" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="17" fill="#f87171">做。</text>
    <text x="16" y="92" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="17" fill="#f87171">好。</text>
    <text x="16" y="118" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="17" fill="#f87171">做。</text>
    <text x="16" y="144" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="17" fill="#f87171">好。</text>
    <text x="16" y="172" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="12" fill="#6b6b85">… × 602 行</text>

    <!-- AFTER -->
    <g transform="translate(184,0)">
      <rect x="0" y="0" width="184" height="186" rx="10" fill="#0f1015" stroke="#2a2a38"/>
      <text x="16" y="30" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="11.5" fill="#6f6f88" letter-spacing="0.12em">AFTER</text>
      <text x="16" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif" font-size="14" fill="#2dd4bf">调用 image_crop，</text>
      <text x="16" y="90" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif" font-size="14" fill="#2dd4bf">参数 …</text>
      <text x="16" y="140" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="13" fill="#4ade80">→ tool call</text>
      <text x="16" y="172" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="12" fill="#6b6b85">1 步搞定</text>
    </g>
  </g>
</svg>
