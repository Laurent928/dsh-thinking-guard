<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Same thought, minus the transition words that carry no information">
  <style>
    text { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif; }
    .h1 { font-size: 15px; font-weight: 700; fill: #334155; }
    .keep { font-size: 13.5px; fill: #1f2937; }
    .fill { font-size: 12.5px; fill: #b45309; font-weight: 600; }
    .cap { font-size: 13px; fill: #64748b; }
    .badge { font-size: 15px; font-weight: 700; fill: #047857; }
    .badgesub { font-size: 12px; fill: #059669; }
    .arrow { font-size: 12px; fill: #94a3b8; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <g>
    <rect x="24" y="40" width="396" height="212" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="48" y="70" class="h1">What the model just wrote</text>
    <text x="52" y="100" class="keep">Check docs/ first, confirm the entry.<animate attributeName="y" values="100;100;100;100;100" keyTimes="0;0.30;0.42;0.94;1" dur="7s" repeatCount="indefinite"/></text>
    <g>
      <rect x="48" y="109" width="60" height="20" rx="6" fill="#fef3c7"/>
      <text x="57" y="122" class="fill">Do.</text>
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.18;0.30;0.86;0.92;0.98;1" dur="7s" repeatCount="indefinite"/>
    </g>
    <text x="52" y="144" class="keep">Keep the parameters from the last run.<animate attributeName="y" values="144;144;130;130;144" keyTimes="0;0.30;0.42;0.94;1" dur="7s" repeatCount="indefinite"/></text>
    <g>
      <rect x="48" y="153" width="60" height="20" rx="6" fill="#fef3c7"/>
      <text x="57" y="166" class="fill">OK.</text>
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.18;0.30;0.86;0.92;0.98;1" dur="7s" repeatCount="indefinite"/>
    </g>
    <text x="52" y="188" class="keep">Compare the render against the final.<animate attributeName="y" values="188;188;160;160;188" keyTimes="0;0.30;0.42;0.94;1" dur="7s" repeatCount="indefinite"/></text>
    <g>
      <rect x="48" y="197" width="60" height="20" rx="6" fill="#fef3c7"/>
      <text x="57" y="210" class="fill">Go.</text>
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.18;0.30;0.86;0.92;0.98;1" dur="7s" repeatCount="indefinite"/>
    </g>
    <text x="52" y="232" class="keep">Roll back if it does not match.<animate attributeName="y" values="232;232;190;190;232" keyTimes="0;0.30;0.42;0.94;1" dur="7s" repeatCount="indefinite"/></text>
    <animate attributeName="opacity" values="1;1;1;0.45;0.45;1" keyTimes="0;0.30;0.42;0.86;0.94;1" dur="7s" repeatCount="indefinite"/>
  </g>

  <g>
    <line x1="428" y1="150" x2="452" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>
  </g>

  <g opacity="0.85">
    <rect x="460" y="40" width="396" height="212" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="484" y="70" class="h1">What actually goes out</text>
    <text x="488" y="100" class="keep">Check docs/ first, confirm the entry.</text>
    <text x="488" y="130" class="keep">Keep the parameters from the last run.</text>
    <text x="488" y="160" class="keep">Compare the render against the final.</text>
    <text x="488" y="190" class="keep">Roll back if it does not match.</text>
    <g opacity="0">
      <rect x="484" y="204" width="118" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="498" y="221" class="badge">92% kept</text>
      <text x="484" y="242" class="badgesub">the dropped 8% was all filler</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.54;0.90;1" dur="7s" repeatCount="indefinite"/>
    </g>
    <animate attributeName="opacity" values="0.85;0.85;1;1;0.85" keyTimes="0;0.30;0.42;0.90;1" dur="7s" repeatCount="indefinite"/>
  </g>

  <text x="440" y="286" class="cap" text-anchor="middle">Same thought, minus the transition words that carry no information</text>
</svg>
