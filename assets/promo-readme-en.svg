  <text x="72" y="88" class="kicker">DEEPSEEK HARNESS · PLUGIN</text>
  <text x="72" y="212" class="l1">It is not thinking.</text>
  <text x="68" y="300" class="l2">It is stuck.</text>
  <text x="72" y="360" class="stat">602 of its 686 lines repeat the same sentence.</text>
  <text x="72" y="432" class="fix1">So we take out the filler —</text>
  <text x="72" y="484" class="fix2">and keep every real sentence.</text>

  <text x="72" y="604" class="url">github.com/Laurent928/dsh-thinking-guard</text>
  <text x="1212" y="586" class="name" text-anchor="end">dsh-thinking-guard</text>
  <text x="1212" y="608" class="tag" text-anchor="end">a loop guard for the thinking channel</text>
