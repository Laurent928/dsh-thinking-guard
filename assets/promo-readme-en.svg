  <text x="72" y="76" class="label">DEEPSEEK HARNESS · PLUGIN</text>

  <text x="72" y="196" class="l1">It is not thinking.</text>
  <text x="68" y="296" class="l2">It is stuck.</text>

  <text x="72" y="356" class="stat">602 of its 686 lines repeat the same sentence.</text>

  <text x="72" y="428" class="fix">So we take out the filler —</text>
  <text x="72" y="480" class="accent">and keep every real sentence.</text>

  <g>
    <rect x="72" y="506" width="446" height="38" rx="19" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="94" y="531" class="chip">92% of the reasoning still reaches the model</text>
  </g>

  <text x="72" y="600" class="url">github.com/Laurent928/dsh-thinking-guard</text>

  <text x="1212" y="586" class="name" text-anchor="end">dsh-thinking-guard</text>
  <text x="1212" y="610" class="tag" text-anchor="end">a loop guard for the thinking channel</text>
</svg>
