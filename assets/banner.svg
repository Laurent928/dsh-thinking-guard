<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="dsh-thinking-guard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14151b"/>
      <stop offset="100%" stop-color="#1d1a2b"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="28%" stop-color="#60a5fa"/>
      <stop offset="54%" stop-color="#2dd4bf"/>
      <stop offset="78%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1000" height="240" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="239" rx="16" fill="none" stroke="#2c2c3a"/>

  <text x="48" y="82" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="15" fill="#8b8ba7">DeepSeek Harness · plugin</text>
  <text x="48" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#f4f4f8">dsh-thinking-guard</text>
  <text x="48" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',Helvetica,Arial,sans-serif" font-size="18" fill="#a3a3bb">让模型别再对着「好。做。好。」原地打转</text>

  <!-- 五档色阶条 -->
  <g transform="translate(48,198)">
    <rect x="-2" y="-10" width="140" height="16" rx="8" fill="#2dd4bf" opacity="0.35" filter="url(#soft)"/>
    <rect x="0" y="-3" width="112" height="3" rx="1.5" fill="url(#ramp)"/>
    <g>
      <rect x="0" y="-7" width="20" height="11" rx="3" fill="#94a3b8"/>
      <rect x="23" y="-7" width="20" height="11" rx="3" fill="#60a5fa"/>
      <rect x="46" y="-7" width="20" height="11" rx="3" fill="#2dd4bf"/>
      <rect x="69" y="-7" width="20" height="11" rx="3" fill="#fbbf24"/>
      <rect x="92" y="-7" width="20" height="11" rx="3" fill="#f87171"/>
    </g>
  </g>
  <text x="172" y="198" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="12" fill="#6f6f88">off · tell · cut slow · cut fast · abort</text>

  <!-- 右侧：退化缩略 -->
  <g transform="translate(660,54)" opacity="0.9">
    <rect x="0" y="0" width="292" height="132" rx="10" fill="#0f1015" stroke="#2a2a38"/>
    <text x="16" y="26" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="11" fill="#5b5b74">before</text>
    <text x="16" y="54" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="13" fill="#f87171">做。</text>
    <text x="16" y="74" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="13" fill="#f87171">好。</text>
    <text x="16" y="94" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="13" fill="#f87171">做。</text>
    <text x="16" y="114" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="11" fill="#6b6b85">… × 602 lines</text>

    <g transform="translate(150,0)">
      <rect x="0" y="0" width="142" height="132" rx="10" fill="#0f1015" stroke="#2a2a38"/>
      <text x="14" y="26" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="11" fill="#5b5b74">after</text>
      <text x="14" y="56" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="12" fill="#2dd4bf">调用 image_crop，</text>
      <text x="14" y="76" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="12" fill="#2dd4bf">参数 …</text>
      <text x="14" y="106" font-family="ui-monospace,SFMono-Regular,'SF Mono',Consolas,'Liberation Mono',Menlo,'Microsoft YaHei',monospace" font-size="11" fill="#6b6b85">→ tool call</text>
    </g>
  </g>
</svg>
