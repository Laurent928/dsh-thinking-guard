<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Click to toggle cleaning · drag sideways for the tier · drag up to apply everywhere">
  <style>
    text { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif; }
    .cap { font-size: 14px; font-weight: 600; fill: #33404d; }
    .sub { font-size: 12px; fill: #98a2ad; }
    .scene { font-size: 12px; fill: #98a2ad; }
    .tag { font-size: 11px; font-weight: 600; }
  </style>
  <defs>
    <filter id="b" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>
  
  <g>
    <circle cx="150" cy="120" r="30" fill="#5d9c83" opacity="0.28" filter="url(#b)"/>
    <g opacity="1"><circle cx="150" cy="120" r="18" fill="#5d9c83"/>
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.18;0.22;0.45;0.5;1" dur="9s" repeatCount="indefinite"/>
    </g>
    <g opacity="0"><circle cx="150" cy="120" r="18" fill="#9aa3ad"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.22;0.45;0.5;1" dur="9s" repeatCount="indefinite"/>
    </g>
    <circle cx="150" cy="160" r="4" fill="#33404d" opacity="0.55">
      <animate attributeName="opacity" values="0;0.55;0;0;0.55;0" keyTimes="0;0.12;0.18;0.5;0.56;0.62" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g opacity="0.35"><circle cx="420" cy="120" r="13" fill="#5d9c83"/>
      <animate attributeName="opacity" values="1;1;0.35;0.35;1" keyTimes="0;0.30;0.34;0.96;1" dur="9s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.35"><path d="M450 106 L465.68 132.88 L434.32 132.88 Z" fill="#c19a4b"/>
      <animate attributeName="opacity" values="0.35;0.35;1;1;0.35;0.35;1" keyTimes="0;0.30;0.34;0.62;0.66;0.96;1" dur="9s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.35"><rect x="467" y="107" width="26" height="26" rx="2.34" fill="#b76a63"/>
      <animate attributeName="opacity" values="0.35;0.35;1;1;0.35" keyTimes="0;0.62;0.66;0.96;1" dur="9s" repeatCount="indefinite"/>
    </g>
  
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -26;0 -26;0 0;0 0" keyTimes="0;0.55;0.68;0.90;0.97;1" dur="9s" repeatCount="indefinite"/>
    <circle cx="750" cy="120" r="15" fill="#5d9c83"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.74;0.92;0.97;1" dur="9s" repeatCount="indefinite"/>
    <rect x="708" y="150" width="84" height="21" rx="10.5" fill="#f3f1ff" stroke="#ddd6fe"/>
    <text x="750" y="165" text-anchor="middle" class="tag" fill="#7c5cf0">all sessions</text>
  </g>
  <text x="150" y="238" text-anchor="middle" class="scene">Click: cleaning on/off</text>
  <text x="450" y="238" text-anchor="middle" class="scene">Drag: pick a tier</text>
  <text x="750" y="238" text-anchor="middle" class="scene">Drag up: all sessions</text>
  <text x="450" y="266" text-anchor="middle" class="cap">Click to toggle cleaning · drag sideways for the tier · drag up to apply everywhere</text>
  <text x="450" y="286" text-anchor="middle" class="sub">colour = history cleaning, shape = how hard it hits</text>
</svg>
